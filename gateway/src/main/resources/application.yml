server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          x-forwarded:
            prefix-enable: true
          routes:
            # ---------- RUTA 1: hacia servicio-a ----------
            # El contexto público (/api) lo pone el Gateway; pacientes solo conoce /pacientes
            - id: ruta-pacientes
              uri: lb://pacientes
              predicates:
                - Path=/api/pacientes/**
              filters:
                - StripPrefix=2
            # ---------- RUTA 2 (opcional): hacia medicos ----------
            - id: ruta-medicos
              uri: lb://medicos
              predicates:
                - Path=/api/medicos/**
              filters:
                - StripPrefix=2

            # ---------- RUTA 3 (opcional): hacia =citas ----------
            - id: ruta-citas
              uri: lb://citas
              predicates:
                - Path=/api/citas/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true   # Registrarse con la IP y no con el nombre de host